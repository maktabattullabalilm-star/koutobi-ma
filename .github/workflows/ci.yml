name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # no-secrets, version, format:check, lint, typecheck, test:coverage
      - run: npm run verify
      # smoke build; no VITE_* secrets present, so it runs in DEMO_MODE
      - run: npm run build
